<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Airways</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="logo">
            <img src="project-logo.png" alt="">
            <span>Airitson</span>
        </div>

        <nav id="navbar">
            <a href="#">Home</a>
            <a href="about/about.html">About</a>
            <a href="#">Offers</a>
            <a href="#">Seats</a>
            <a href="#">Destinations</a>
        </nav>
        <div class="nav-btns">
            <a href="sing in/login.html" class="signin">Sign In</a>

            <a href="contact/contact.html" class="contact-btn">Contact</a>
            <div class="menu" id="menu-btn"><i data-feather="menu"></i></div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">

        <!-- Background Video -->
        <video autoplay muted loop playsinline class="bg-video">
            <source src="plane_background_video.mp4" type="video/mp4">
        </video>

        <div class="hero-content">
            <h1>Create Ever-lasting Memories With Us</h1>

            <div class="hero-img">
                <img src="plane.png" alt="Airplane">
            </div>
        </div>

    </section>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-wrapper">
            <h1>Find Your Next Adventure</h1>
            <p class="sub-heading">Search flights, compare prices, and book with ease.</p>

            <div class="search-container">
                <div class="trip-type">
                    <select id="trip-type">
                        <option value="round">Round Trip</option>
                        <option value="oneway">One Way</option>
                    </select>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Dropping Point (From)</label>
                        <div class="input-with-icon">
                            <i data-feather="map-pin"></i>
                            <input type="text" id="from-input" placeholder="City or Airport" value="Kolkata">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Destination (To)</label>
                        <div class="input-with-icon">
                            <i data-feather="map-pin"></i>
                            <input type="text" id="to-input" placeholder="City or Airport" value="Mumbai">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Departure</label>
                        <input type="date" id="departure-date" value="2025-11-20">
                    </div>
                    <div class="input-group">
                        <label>Return</label>
                        <input type="date" id="return-date">
                    </div>
                    <div class="input-group">
                        <label>Passengers</label>
                        <select id="passengers">
                            <option value="1">1 Passenger</option>
                            <option value="2">2 Passengers</option>
                            <option value="3">3 Passengers</option>
                            <option value="4">4+ Passengers</option>
                        </select>
                    </div>
                </div>

                <button class="search-btn" id="search-btn">Search Flights</button>
            </div>
        </div>
    </section>

    <script type="module" src="script.js"></script>
    <script>feather.replace();</script>

</body>

</html>
